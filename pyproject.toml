[project]
name = "code-to-txt"
version = "0.3.0"
description = "Convert code files to a single text file for LLM consumption"
authors = [
    { name = "Andrii Sonsiadlo", email = "andrii.sonsiadlo@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gitpython>=3.1.46,<4.0.0",
    "click>=8.3.1,<9.0.0",
    "pathspec>=1.0.4,<2.0.0",
    "pyperclip>=1.8.2,<2.0.0",
    "pyyaml>=6.0.0,<7.0.0",
]

[tool.poetry]
packages = [{ include = "code_to_txt", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
ruff = "^0.14.14"
mypy = "^1.19.1"
types-pyyaml = "^6.0.12"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
code-to-txt = "code_to_txt.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true